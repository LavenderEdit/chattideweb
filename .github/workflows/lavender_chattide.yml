# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy WAR app to Azure Web App - Chattide

on:
  push:
    branches:
      - lavender
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare deployment bundle
        run: |
          # Create folder for context path
          mkdir -p deploy/ChattideWeb
          # Move WAR into folder as ROOT.war for correct Tomcat context
          mv target/*.war deploy/ChattideWeb/ROOT.war
          # Zip the folder structure
          cd deploy && zip -r ../app.zip .

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_918186E1983E4661BE10DD5528128E5F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_28F195C9996C49D988C888C2167A2CBF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_12097FCB295D4F6A91E9EF82DE1E09E5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Chattide'
          slot-name: 'Production'
          package: 'app.zip'
