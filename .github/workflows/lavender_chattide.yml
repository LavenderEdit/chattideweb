# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# Este workflow construye, renombra y despliega el WAR en el contexto /ChattideWeb/

name: Build and deploy WAR app to Azure Web App - chattide

on:
  push:
    branches:
      - lavender
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Necesario para actions/checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Build & rename WAR
        run: |
          mvn clean package
          # Renombrar el WAR al contexto deseado
          mv target/*.war target/ChattideWeb.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: chattide-wars
          path: target/ChattideWeb.war

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: chattide-wars

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name:       chattide           # Nombre de tu App Service
          slot-name:      Production         # Slot, si no usas slots pon vacío o quita esta línea
          package:        target/ChattideWeb.war
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
