# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy WAR app to Azure Web App - chattide

on:
  push:
    branches:
      - lavender
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Build & rename WAR
        run: |
          mvn clean package
          # Rename WAR to match context path
          mv target/*.war target/ChattideWeb.war

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chattide-wars
          path: target/ChattideWeb.war

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write # For OIDC auth
      contents: read

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: chattide-wars

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: chattide
          slot-name: Production
          package: target/ChattideWeb.war
